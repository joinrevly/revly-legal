<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<title>Page not found — Revly</title>
<style>
:root{
  --bg:#ffffff; --fg:#1a1a1a; --muted:#5b6472; --accent:#e5533c;
  --line:#e6e8eb; --card:#f7f8fa; --code:#f0f2f4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1216; --fg:#e7e9ec; --muted:#9aa4b2; --accent:#ff6a4d;
    --line:#232a33; --card:#161b21; --code:#1b2128;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px; margin:0 auto; padding:32px 20px 96px}
header.site{
  display:flex; align-items:center; gap:10px;
  padding:16px 20px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:var(--bg); z-index:5;
}
header.site .brand{font-weight:700; letter-spacing:.2px; color:var(--fg); text-decoration:none}
header.site .brand span{color:var(--accent)}
header.site nav{margin-left:auto; display:flex; flex-wrap:wrap; gap:8px 16px; font-size:14px; justify-content:flex-end}
header.site nav a{color:var(--muted); text-decoration:none}
header.site nav a:hover{color:var(--fg)}
h1{font-size:30px; line-height:1.25; margin:8px 0 4px}
h2{font-size:21px; margin:38px 0 10px; padding-top:8px}
h3{font-size:17px; margin:26px 0 8px}
p,li{color:var(--fg)}
a{color:var(--accent)}
hr{border:none; border-top:1px solid var(--line); margin:32px 0}
strong{font-weight:650}
table{border-collapse:collapse; width:100%; font-size:14.5px; margin:14px 0}
.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:10px}
th,td{border-bottom:1px solid var(--line); padding:10px 12px; text-align:left; vertical-align:top}
th{background:var(--card); font-weight:650}
tr:last-child td{border-bottom:none}
code{background:var(--code); padding:2px 6px; border-radius:6px; font-size:13.5px}
.meta{color:var(--muted); font-size:14px}
.updated{color:var(--muted); font-size:13.5px; margin-top:6px}
footer{margin-top:56px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:13px}
/* landing */
.hero{padding:64px 0 8px}
.hero h1{font-size:34px}
.cards{display:grid; gap:14px; grid-template-columns:1fr 1fr; margin-top:28px}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{display:block; padding:20px; border:1px solid var(--line); border-radius:14px; background:var(--card); text-decoration:none; color:var(--fg)}
.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 6px}
.card p{margin:0; color:var(--muted); font-size:14px}
/* share-link fallback */
.share{padding:56px 0; text-align:center}
.share .handle{font-size:32px; font-weight:700; margin:0 0 6px; word-break:break-all}
.share .lead{color:var(--muted); margin:0 0 28px}
.btn{display:inline-block; padding:13px 26px; border-radius:999px; background:var(--accent);
     color:#fff; text-decoration:none; font-weight:650}
.btn.secondary{background:transparent; color:var(--fg); border:1px solid var(--line)}
.btnrow{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
</style>
</head>
<body>
<header class="site">
  <a class="brand" href="/">Rev<span>ly</span></a>
  <nav>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="/community-guidelines">Guidelines</a>
    <a href="/consumer-health-data">Health Data</a>
  </nav>
</header>
<main class="wrap">

<section class="share" id="share" hidden>
  <p class="handle" id="handle"></p>
  <p class="lead" id="lead"></p>
  <div class="btnrow">
    
    <a class="btn secondary" id="open-app" href="#" hidden>Open in Revly</a>
  </div>
  <p class="meta" style="margin-top:18px">Revly is coming to the App Store.</p>
</section>
<section class="share" id="notfound">
  <h1>Page not found</h1>
  <p class="lead">That link doesn't point anywhere on this site.</p>
  <div class="btnrow"><a class="btn secondary" href="/">Go to the homepage</a></div>
</section>
<script>
(function () {
  var KINDS = {
    u: { label: 'rider', prefix: '@' },
    p: { label: 'drive', prefix: '' },
    t: { label: 'circuit', prefix: '' }
  };
  var parts = window.location.pathname.split('/').filter(Boolean);
  var kind = parts.length === 2 ? KINDS[parts[0]] : null;
  // Never trust the path: it is attacker-controlled and this page is public.
  // Whitelist the same characters the app allows in an id, and write through
  // textContent so nothing in it can become markup.
  var value = kind ? (parts[1].match(/^[A-Za-z0-9._-]{1,80}$/) ? parts[1] : '') : '';
  if (!kind || !value) { return; }

  document.title = kind.prefix + value + ' — Revly';
  document.getElementById('handle').textContent = kind.prefix + value;
  document.getElementById('lead').textContent =
    'Open this ' + kind.label + ' in Revly.';
  document.getElementById('share').hidden = false;
  document.getElementById('notfound').hidden = true;

  var open = document.getElementById('open-app');
  open.href = 'revly://' + parts[0] + '/' + value;
  open.hidden = false;
})();
</script>

<footer>© 2026 Revly · Gökdeniz Kaymaz &amp; Suat Emir Atabey · <a href="mailto:support@joinrevly.com">support@joinrevly.com</a></footer>
</main>
</body>
</html>
