<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Revly">
  <!--
    A dial, not a letter.

    Braun's design language is instruments — gauges, dials, a single needle
    against a clean face — which happens to be exactly the right mark for a
    driving app. It also sidesteps the trap of setting a letterform in a favicon:
    a <text> glyph depends on whatever font the renderer happens to have, and at
    16px an "R" in the wrong face is mush.

    The accent matches AccentColor.colorset in the app, including its dark
    variant, so the tab icon and the app icon agree about what colour Revly is.
  -->
  <style>
    .face { fill: #00738f; }
    .mark { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .face { fill: #3fc1e0; }
      .mark { stroke: #04141a; }
    }
  </style>

  <rect class="face" width="32" height="32" rx="7.5" />
  <g class="mark" fill="none" stroke-linecap="round">
    <path d="M8.5 21.5a9 9 0 1 1 15 0" stroke-width="2.2" opacity="0.5" />
    <path d="M16 17.5 21.5 10.5" stroke-width="2.8" />
  </g>
</svg>
